<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bronze Dawn Sprites</title>
  <style>
    body { margin: 0; background: #5a8a38; color: #fff; font: 12px/1.3 system-ui, sans-serif; }
    nav { position: sticky; top: 0; z-index: 2; background: #2a2016; padding: 6px 10px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
    nav a { color: #f0d890; text-decoration: none; }
    nav a.on { color: #fff; font-weight: 700; text-decoration: underline; }
    h2 { margin: 14px 10px 4px; font-size: 15px; text-shadow: 0 1px 0 #000; }
    .grid { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px; padding: 0 10px; }
    figure { margin: 0; display: flex; flex-direction: column; align-items: center; }
    figcaption { font-size: 10px; color: #f4f0e0; text-shadow: 0 1px 0 #000; max-width: 220px; text-align: center; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
  </style>
</head>
<body>
  <nav id="nav"></nav>
  <main id="main"></main>
  <script type="module" src="./src/gallery.ts"></script>
</body>
</html>
