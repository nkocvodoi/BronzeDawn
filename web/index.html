<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bronze Dawn</title>
  <meta name="description" content="A Stone Age real-time strategy game. Play in your browser against the computer." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 29 16 16 29 3 16z' fill='%23c7a34d'/%3E%3Cpath d='M16 9 23 16 16 23 9 16z' fill='%233373eb'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya+Sans:wght@500;700&display=swap" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <header id="topbar">
    <span id="res-food">Food</span><span id="res-wood">Wood</span><span id="res-gold">Gold</span><span id="res-stone">Stone</span>
    <span id="pop" class="strong">Pop</span><span id="age" class="gold">Stone Age</span>
    <span class="spacer"></span><span id="speed" title="Game speed: click, or + and -">1x</span><span id="clock">0:00</span>
  </header>
  <div id="messages"></div>
  <div id="dragbox" hidden></div>
  <footer id="panel">
    <div id="minimap-frame"><canvas id="minimap" width="440" height="220"></canvas></div>
    <div id="portrait-frame"><canvas id="portrait" width="96" height="96" hidden></canvas></div>
    <section id="info">
      <h2 id="info-title"></h2>
      <div id="hp" class="bar" hidden><i id="hp-bar"></i></div>
      <p id="info-0"></p><p id="info-1"></p><p id="info-2"></p><p id="info-3"></p>
      <div id="progress" class="bar thin" hidden><i id="progress-bar"></i></div>
    </section>
    <section id="commands"></section>
  </footer>
  <div id="tooltip" hidden></div>
  <div id="overlay" hidden></div>
  <noscript>Bronze Dawn needs JavaScript and WebGL.</noscript>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
