<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bronze Dawn</title>
  <meta name="description" content="A Stone Age real-time strategy game. Play in your browser against the computer." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 29 16 16 29 3 16z' fill='%23c7a34d'/%3E%3Cpath d='M16 9 23 16 16 23 9 16z' fill='%233373eb'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya+Sans:wght@500;700&display=swap" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <!-- Laid out on an 800 x 600 screen, as the original, and scaled to the window with --u. -->
  <header id="topbar">
    <div class="left">
      <span id="res-wood" class="res" title="Wood">0</span><span id="res-food" class="res" title="Food">0</span><span id="res-gold" class="res" title="Gold">0</span><span id="res-stone" class="res" title="Stone">0</span>
      <span id="pop" title="Population">0/0</span>
    </div>
    <div class="center"><span id="age">Stone Age</span><span id="clock" hidden></span></div>
    <div class="right">
      <button id="diplomacy-btn" title="The players and their civilizations">Diplomacy</button><button id="menu-btn" title="Pause, options and help (F10)">Menu</button>
    </div>
  </header>
  <div id="messages"></div>
  <div id="dragbox" hidden></div>
  <div id="scores" hidden></div>
  <footer id="panel">
    <section id="status">
      <div id="owner-line"></div>
      <h2 id="info-title"></h2>
      <div id="portrait-box">
        <canvas id="portrait" width="64" height="64"></canvas>
        <div id="stats"></div>
      </div>
      <div id="hp" class="bar"><i id="hp-bar"></i></div>
      <div id="hp-text"></div>
      <p id="info-0"></p><p id="info-1"></p>
      <div id="queue"></div>
      <div id="progress" class="bar thin" hidden><i id="progress-bar"></i></div>
    </section>
    <section id="commands"></section>
    <section id="minimap-box">
      <canvas id="minimap" width="440" height="220"></canvas>
      <button id="score-btn" title="Scores (F4)">S</button>
      <button id="help-btn" title="Controls (F1)">?</button>
    </section>
  </footer>
  <div id="tooltip" hidden></div>
  <div id="overlay" hidden></div>
  <noscript>Bronze Dawn needs JavaScript and WebGL.</noscript>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
