# Tests the web build on every push and pull request, and publishes it to GitHub Pages from main.
# One-time setup by the repo owner: Settings > Pages > Source: GitHub Actions.
name: web

on:
  push:
    branches: [main]
    paths: ["web/**", "data/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "data/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      # A TURN relay for players on strict networks, if the repo has one set up (Settings > Secrets and
      # variables > Actions): variables TURN_URLS and TURN_USERNAME, secret TURN_CREDENTIAL. Without them
      # the game still plays online wherever the two machines can reach each other.
      - run: npm run build
        env:
          VITE_TURN_URLS: ${{ vars.TURN_URLS }}
          VITE_TURN_USERNAME: ${{ vars.TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
